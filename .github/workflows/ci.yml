name: ci

on:
  push:
  pull_request:

jobs:
  native-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Native validation
        run: ./scripts/validate-artifact.sh

  docker-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t spruce-poc .
      - name: Prepare writable artifact directory
        run: mkdir -p artifacts/docker && chmod 0777 artifacts/docker
      - name: Docker preset list
        run: docker run --rm spruce-poc list
      - name: Docker WF-128 v2 benchmark
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -e ARTIFACT_ROOT=/artifacts/smallwood-salted-v2
          -v "$PWD/artifacts/docker:/artifacts"
          spruce-poc bench system-n1024-wf128-crom-v2
      - name: Docker v2 functional gate
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --entrypoint issuance
          -v "$PWD/artifacts/docker:/artifacts"
          spruce-poc gate-functional-presets
          -artifact-dir /artifacts/smallwood-salted-v2
